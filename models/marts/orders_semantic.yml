version: 2

semantic_models:
  - name: orders
    description: Order-level semantic model for smoke testing
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order
        type: primary
        expr: order_id

      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: revenue
        agg: sum
        expr: amount

metrics:
  - name: revenue
    type: simple
    type_params:
      measure: revenue

models:
  - name: all_dates
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
