version: 2

models:
  - name: fct_orders
    description: Order-level semantic model for smoke testing
    semantic_model:
      enabled: true
      name: orders
    agg_time_dimension: order_date
    columns:
      - name: order_id
        entity:
          name: order
          type: primary

      - name: customer_id
        entity:
          name: customer
          type: foreign

      - name: order_date
        granularity: day
        dimension:
          type: time

    metrics:
      - name: revenue
        type: simple
        agg: sum
        expr: amount

  - name: all_dates
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
